[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rcqp"
version = "0.1.0"
description = "RCQP: constrained optimization solver with complementarity constraints"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
    "-DRCQP_BUILD_PYTHON=ON",
    "-DRCQP_BUILD_JULIA=OFF",
    "-DRCQP_GENERATE_PYI=OFF",
]
wheel.packages = []
