[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "marble"
version = "0.1.0"
description = "Marble: constrained optimization solver with complementarity constraints"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-type = "Release"
cmake.args = [
    "-DMARBLE_BUILD_PYTHON=ON",
    "-DMARBLE_BUILD_JULIA=OFF",
    "-DMARBLE_GENERATE_PYI=OFF",
]
wheel.packages = []
